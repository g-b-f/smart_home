<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flask Slider JSON Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 10vh;
            box-sizing: border-box;
            line-height: 1.6;
        }
        .container {
            width: min(90vw, 25rem);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: clamp(1rem, 3vw, 2rem);
            box-sizing: border-box;
        }
        .control-group {
            margin-bottom: clamp(1rem, 3vh, 1.5rem);
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        label {
            display: flex;
            justify-content: center;
            margin-bottom: 0.5rem;
            font-weight: bold;
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            text-align: center;
        }
        .toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            cursor: pointer;
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
        }
        .toggle input {
            width: clamp(1.2rem, 4vw, 1.5rem);
            height: clamp(1.2rem, 4vw, 1.5rem);
            cursor: pointer;
        }
        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }
        button {
            width: 100%;
            padding: clamp(0.6rem, 2vw, 0.8rem);
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            cursor: pointer;
        }
        #response-text {
            color: blue;
            font-weight: bold;
            margin-top: 1rem;
            font-size: clamp(0.85rem, 2.2vw, 1rem);
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="control-group">
            <label for="my-slider">Brightness: <span id="slider-display">50</span></label>
            <input type="range" id="my-slider" min="0" max="100" value="50">
        </div>

        <div class="control-group">
            <label for="colortemp-slider">Color Temperature: <span id="colortemp-display">3750</span>K</label>
            <input type="range" id="colortemp-slider" min="1000" max="6500" value="3750">
        </div>

        <div class="control-group">
            <label class="toggle">
                <input type="checkbox" id="on-toggle">
                On
            </label>
        </div>

        <button id="my-button">Send Value to Python</button>

        <p id="response-text"></p>
    </div>

    <script>
        const slider = document.getElementById('my-slider');
        const sliderDisplay = document.getElementById('slider-display');
        const colortempSlider = document.getElementById('colortemp-slider');
        const colortempDisplay = document.getElementById('colortemp-display');
        const onToggle = document.getElementById('on-toggle');
        const button = document.getElementById('my-button');
        const responseText = document.getElementById('response-text');

        let onToggled = false;

        slider.addEventListener('input', function() {
            sliderDisplay.innerText = slider.value;
        });

        colortempSlider.addEventListener('input', function() {
            colortempDisplay.innerText = colortempSlider.value;
        });

        onToggle.addEventListener('change', function() {
            onToggled = true;
        });

        button.addEventListener('click', function() {
            const payload = {
                brightness: Number(slider.value),
                colortemp: Number(colortempSlider.value)
            };

            if (onToggled) {
                payload.on = onToggle.checked;
            }

            console.info(`Sending payload: ${JSON.stringify(payload)}`);

            fetch('/set_lights', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            // .then(response => response.json())
            .then(data => { responseText.innerText = data.message })
            .catch(error => {
                console.error('Error:', error);
                responseText.innerText = `Error: ${error}`;
            });
        });
    </script>

</body>
</html>
