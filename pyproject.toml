[project]
name = "smart-home"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.14.1",
    "pyfracturedjson>=2.2.2",
    "apscheduler>=3.11.3",
    "astral>=3.2",
    "colour>=0.1.5",
    "flask[async]>=3.1.3",
    "hypercorn>=0.18.0",
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
    "pywizlight>=0.6.6",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "humanize>=4.16.0",
    "zigpy>=2.3.0",
    "bellows>=1.1.0",
    "zha-quirks",
]

[project.scripts]
bulb = "smart_home.cli.bulb:bulb"


[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
    "responses>=0.26.3",
    "pytest-cov>=7.1.0",
    "matplotlib>=3.11.2",
]

[tool.ruff.lint]
extend-select = [
    "BLE",  # Blind exceptions
    "A",    # Builtin shadowing
    "C4",   # Comprehensions
    "LOG",  # Logging
    "G",    # Logging formatting
    "PT",   # Pytest
    "SIM",  # Simplifications
    "TID",  # Tidy imports
    "PTH",  # Use Pathlib instead of os.path etc
    "I",    # isort
    "C901", # flake8-c901 complexity
]

extend-ignore = [
    "PTH123" # allow `open()`
]
