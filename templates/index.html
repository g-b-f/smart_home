<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulb control</title>
    <style>
    {{css}}
    </style>
</head>

<body>
    <div class="container">
        <div class="control-group">
            <label for="my-slider">Brightness: <span id="slider-display">128</span></label>
            <input type="range" id="my-slider" min="0" max="255" value="128">
        </div>

        <div class="control-group">
            <label for="colortemp-slider">Color Temperature: <span id="colortemp-display">3750</span>K</label>
            <input type="range" id="colortemp-slider" min="1000" max="6500" value="3750">
        </div>

        <!-- <div class="control-group">
            <label class="toggle">
                <input type="checkbox" id="on-toggle">
                On
            </label>
        </div> -->
        <button id="switch-button">Turn On</button>
        <button id="send-button">Send</button>


        <p id="response-text"></p>
    </div>

    <script>
        var isOn = true;

        const slider = document.getElementById('my-slider');
        const sliderDisplay = document.getElementById('slider-display');
        const colortempSlider = document.getElementById('colortemp-slider');
        const colortempDisplay = document.getElementById('colortemp-display');
        const sendButton = document.getElementById('send-button');
        const switchButton = document.getElementById('switch-button');
        const responseText = document.getElementById('response-text');

        if (isOn) {
            switchButton.innerText = 'Turn Off';
        } else {
            switchButton.innerText = 'Turn On';
        }


        slider.addEventListener('input', function() {
            sliderDisplay.innerText = slider.value;
        });

        colortempSlider.addEventListener('input', function() {
            colortempDisplay.innerText = colortempSlider.value;
        });

        sendButton.addEventListener('click', function() {
            const payload = {
                brightness: Number(slider.value),
                colortemp: Number(colortempSlider.value)
            };

            console.info(`Sending payload: ${JSON.stringify(payload)}`);

            fetch('/set_lights', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .catch(error => {
                console.error('Error:', error);
                responseText.innerText = `Error: ${error}`;
            });
        });

    switchButton.addEventListener('click', function() {
        const payload = {
            on: !isOn
        };

        console.info(`Sending toggle action: ${JSON.stringify(payload)}`);

        fetch('/set_lights', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(data => {
            isOn = !isOn;
            if (isOn) {
                switchButton.innerText = 'Turn Off';
            } else {
                switchButton.innerText = 'Turn On';
            }
        })
        .catch(error => {
            console.error('Error:', error);
            responseText.innerText = `Error: ${error}`;
        });
    });
    </script>

</body>
</html>
